<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A4512F;text-decoration:none}a:hover{color:#7E3C21}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F3; color: #1F1E1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 56px 20px 8px; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 34px; font-weight: 500">Discover</h1>
<label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find a new podcast</label>
<div style="display: flex; align-items: center; gap: 8px; background: #F1EEE6; border-radius: 12px; padding: 0 12px; height: 46px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B675E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="find" type="search" placeholder="Shows, people, topics" style="flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; color: #1F1E1B">
</div>
</header>

<div style="flex: 1; overflow: auto; padding: 4px 0 20px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; gap: 8px; overflow-x: auto; padding: 0 20px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="flex-shrink: 0; min-height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.ink}}; font-size: 13px; font-weight: 500">{{c.label}}</button>
</sc-for>
</div>

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0 20px; font-family: Newsreader, Georgia, serif; font-size: 20px; font-weight: 500">Because you listen to The Long Signal</h2>
<div style="display: flex; gap: 14px; overflow-x: auto; padding: 0 20px">
<sc-for list="{{recs}}" as="r" hint-placeholder-count="4">
<div style="width: 132px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
<div style="width: 132px; height: 132px; border-radius: 14px; background: {{r.art}}; color: #FAF8F3; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; font-family: Newsreader, Georgia, serif; font-size: 18px; line-height: 1.05">{{r.name}}</div>
<span style="font-size: 12px; color: #6B675E; line-height: 1.35">{{r.why}}</span>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; padding: 0 20px">
<h2 style="margin: 0 0 4px; font-family: Newsreader, Georgia, serif; font-size: 20px; font-weight: 500">Top in the UK this week</h2>
<sc-for list="{{top}}" as="t" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E8E3D8">
<span style="width: 18px; font-size: 13px; color: #6B675E; font-variant-numeric: tabular-nums">{{t.rank}}</span>
<div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 9px; background: {{t.art}}; color: #FAF8F3; display: flex; align-items: center; justify-content: center; font-family: Newsreader, Georgia, serif; font-size: 16px">{{t.initials}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
<span style="font-size: 12px; color: #6B675E">{{t.cat}}</span>
</div>
<button onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="min-height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.ink}}; font-size: 13px; font-weight: 500">{{t.label}}</button>
</div>
</sc-for>
</section>
</div>

<nav aria-label="Main" style="border-top: 1px solid #E8E3D8; padding: 6px 8px 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<a href="Main.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #6B675E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Up Next</a>
<a href="Main.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #6B675E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Library</a>
<a href="Discover.dc.html" aria-current="page" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #1F1E1B">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Discover</a>
<a href="Search.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #6B675E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'all', followed: { 2: true } }; }
  renderVals() {
    const s = this.state;
    const cats = [['all', 'For you'], ['news', 'News'], ['hist', 'History'], ['sci', 'Science'], ['comedy', 'Comedy'], ['sport', 'Sport']].map(([id, label]) => {
      const on = s.cat === id;
      return { label, on: on ? 'true' : 'false', bg: on ? '#1F1E1B' : 'transparent', ink: on ? '#FAF8F3' : '#1F1E1B', border: on ? '#1F1E1B' : '#D9D4C7', pick: () => this.setState({ cat: id }) };
    });
    const recs = [
      { name: 'Signal & Noise', art: '#4A5D73', why: 'Media history, similar hosts' },
      { name: 'The Archive Room', art: '#7A5368', why: 'Listeners of The Long Signal follow this' },
      { name: 'Dead Air', art: '#5B5750', why: 'Stories from radio’s past' },
      { name: 'Frequencies', art: '#4F6B5A', why: 'Science of sound' }
    ];
    const top = [
      { name: 'Morning Brief', cat: 'News · daily', initials: 'MB', art: '#4A5D73' },
      { name: 'The Long Walk Home', cat: 'Documentary', initials: 'LW', art: '#8A6A3F' },
      { name: 'Tidewater Weekly', cat: 'Society', initials: 'TW', art: '#4F6B5A' },
      { name: 'Two Pints In', cat: 'Comedy', initials: 'TP', art: '#7A5368' },
      { name: 'Full Time', cat: 'Sport', initials: 'FT', art: '#6A5E86' }
    ].map((t, i) => {
      const f = !!s.followed[i];
      return {
        ...t, rank: String(i + 1),
        label: f ? 'Following' : 'Follow',
        pressed: f ? 'true' : 'false',
        bg: f ? '#F1EEE6' : 'transparent',
        ink: f ? '#6B675E' : '#A4512F',
        border: f ? '#F1EEE6' : '#D9D4C7',
        toggle: () => this.setState({ followed: { ...s.followed, [i]: !f } })
      };
    });
    return { cats, recs, top };
  }
}
</script>
</body>
</html>
