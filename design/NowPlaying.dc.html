<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now Playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A4512F;text-decoration:none}a:hover{color:#7E3C21}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F3; color: #1F1E1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 24px 28px; gap: 18px; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; margin: 0 -12px">
<a href="Main.dc.html" aria-label="Close player" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F1E1B">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</a>
<button aria-label="More options" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1F1E1B; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
</button>
</div>

<div style="align-self: center; width: 280px; height: 280px; border-radius: 20px; background: #4A5D73; color: #FAF8F3; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; box-sizing: border-box">
<span style="font-family: Newsreader, Georgia, serif; font-size: 40px; line-height: 1; letter-spacing: -0.01em">The Long Signal</span>
<span style="font-size: 12px; margin-top: 8px; color: #DDE3EA">Episode 142 artwork</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 26px; font-weight: 500; line-height: 1.15">How radio learned to listen</h1>
<p style="margin: 0; font-size: 14px; color: #6B675E">The Long Signal</p>
</div>

<a href="Chapters.dc.html" style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #1F1E1B; min-height: 32px">
<span style="color: #6B675E">Chapter 3</span><span style="font-weight: 500">Clipboards on street corners</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B675E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 8px">
<div role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="3370" aria-valuenow="1122" aria-valuetext="18 minutes 42 seconds" style="position: relative; height: 16px">
<div style="position: absolute; left: 0; right: 0; top: 7px; height: 3px; border-radius: 2px; background: #E2DDD1"></div>
<div style="position: absolute; left: 0; width: 33%; top: 7px; height: 3px; border-radius: 2px; background: #1F1E1B"></div>
<div style="position: absolute; left: 5%; width: 3%; top: 7px; height: 3px; background: #D9A441"></div>
<div style="position: absolute; left: 37%; width: 3%; top: 7px; height: 3px; background: #D9A441"></div>
<div style="position: absolute; left: 71%; width: 4%; top: 7px; height: 3px; background: #D9A441"></div>
<div style="position: absolute; left: calc(33% - 7px); top: 1px; width: 14px; height: 14px; border-radius: 7px; background: #1F1E1B"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #6B675E; font-variant-numeric: tabular-nums">
<span>18:42</span><span>Ad skipped at 18:52</span><span>−37:28</span>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 16px">
<button aria-label="Back 15 seconds" style="width: 56px; height: 56px; border: 0; background: transparent; color: #1F1E1B; position: relative; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4h4"></path></svg>
<span style="position: absolute; font-size: 9px; font-weight: 600; top: 23px">15</span>
</button>
<button onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: #1F1E1B; color: #FAF8F3; display: flex; align-items: center; justify-content: center">
<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
</sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
</sc-if>
</button>
<button aria-label="Forward 30 seconds" style="width: 56px; height: 56px; border: 0; background: transparent; color: #1F1E1B; position: relative; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"></path><path d="M20 4v4h-4"></path></svg>
<span style="position: absolute; font-size: 9px; font-weight: 600; top: 23px">30</span>
</button>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #F1EEE6; border-radius: 14px; padding: 4px">
<button onClick="{{cycleSpeed}}" style="min-height: 44px; border: 0; background: transparent; color: #1F1E1B; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums">{{speed}}</button>
<button aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 10px; background: #FAF8F3; color: #1F1E1B; font-size: 13px; font-weight: 500">Trim</button>
<button aria-pressed="false" style="min-height: 44px; border: 0; background: transparent; color: #6B675E; font-size: 13px">Boost</button>
<button style="min-height: 44px; border: 0; background: transparent; color: #6B675E; font-size: 13px">Sleep</button>
</div>

<div style="margin-top: auto; display: flex; justify-content: space-around">
<a href="Transcript.dc.html" style="min-height: 48px; padding: 0 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #1F1E1B">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M5 11h14M5 16h9"></path></svg>Transcript</a>
<a href="Chapters.dc.html" style="min-height: 48px; padding: 0 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #1F1E1B">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h4M4 12h4M4 18h4M11 6h9M11 12h9M11 18h9"></path></svg>Chapters</a>
<a href="Main.dc.html" style="min-height: 48px; padding: 0 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #1F1E1B">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Up Next</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { playing: true, speedIx: 2 }; }
  renderVals() {
    const speeds = ['1.0×', '1.2×', '1.4×', '1.6×', '2.0×'];
    const s = this.state;
    return {
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ playing: !s.playing }),
      speed: speeds[s.speedIx],
      cycleSpeed: () => this.setState({ speedIx: (s.speedIx + 1) % speeds.length })
    };
  }
}
</script>
</body>
</html>
