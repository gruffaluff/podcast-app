<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A4512F;text-decoration:none}a:hover{color:#7E3C21}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F3; color: #1F1E1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 56px 20px 8px">
<h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 34px; font-weight: 500">Library</h1>
</header>

<div style="flex: 1; overflow: auto; padding: 8px 0 20px; display: flex; flex-direction: column; gap: 26px">

<section style="display: flex; flex-direction: column; gap: 12px">
<a href="Main.dc.html" style="margin: 0 20px; display: flex; align-items: center; gap: 4px; color: #1F1E1B; font-family: Newsreader, Georgia, serif; font-size: 22px; font-weight: 500">New Episodes
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B675E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="display: flex; gap: 14px; overflow-x: auto; padding: 0 20px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<div style="width: 300px; flex-shrink: 0; border-radius: 20px; overflow: hidden; background: {{c.tint}}; color: #FFFFFF; display: flex; flex-direction: column">
<div style="height: 200px; background: {{c.art}}; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; box-sizing: border-box">
<span style="font-family: Newsreader, Georgia, serif; font-size: 30px; line-height: 1; color: #FFFFFF">{{c.show}}</span>
<span style="font-size: 11px; margin-top: 6px; color: {{c.soft}}">Episode artwork</span>
</div>
<div style="padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: {{c.soft}}">{{c.when}}</span>
<span style="font-size: 19px; font-weight: 600; line-height: 1.25">{{c.title}}</span>
<span style="font-size: 14px; color: {{c.soft}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.blurb}}</span>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
<a href="NowPlaying.dc.html" style="min-height: 40px; padding: 0 16px; border-radius: 20px; background: {{c.pill}}; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">
<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>{{c.length}}</a>
<span style="flex: 1"></span>
<button onClick="{{c.toggle}}" aria-label="{{c.dlLabel}}" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<sc-if value="{{c.saved}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg>
</sc-if>
<sc-if value="{{c.notSaved}}" hint-placeholder-val="{{ true }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v9M8 12l4 4 4-4"></path></svg>
</sc-if>
</button>
<button aria-label="More options" style="width: 40px; height: 40px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
</button>
</div>
</div>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px">
<h2 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 22px; font-weight: 500">Your shows</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{shows}}" as="s" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="aspect-ratio: 1; border-radius: 12px; background: {{s.art}}; color: #FFFFFF; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; font-family: Newsreader, Georgia, serif; font-size: 15px; line-height: 1.05">{{s.name}}</div>
<span style="font-size: 12px; color: #6B675E">{{s.meta}}</span>
</div>
</sc-for>
</div>
</section>
</div>

<nav aria-label="Main" style="border-top: 1px solid #E8E3D8; padding: 6px 8px 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<a href="Main.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #6B675E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Up Next</a>
<a href="Library.dc.html" aria-current="page" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #1F1E1B">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Library</a>
<a href="Discover.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #6B675E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Discover</a>
<a href="Search.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #6B675E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { saved: { 1: true } }; }
  renderVals() {
    const s = this.state;
    const cards = [
      { show: 'The Long Signal', art: '#4A5D73', tint: '#2E3D50', pill: '#4A5D73', soft: '#C9D4E0', when: '4h ago', title: 'How radio learned to listen', blurb: 'Clipboards, diaries and pagers: a century of counting listeners.', length: '56m' },
      { show: 'Tidewater Weekly', art: '#4F6B5A', tint: '#2F4538', pill: '#4F6B5A', soft: '#C8D8CC', when: '1d ago', title: 'The salt road', blurb: 'Following an old trade route down the coast.', length: '55m' },
      { show: 'Field Notes FM', art: '#8A6A3F', tint: '#4F3C22', pill: '#7A5C34', soft: '#E3D3B8', when: '2d ago', title: 'The quiet economics of birdsong', blurb: 'Why cities are changing how birds sing.', length: '41m' }
    ].map((c, i) => {
      const saved = !!s.saved[i];
      return { ...c, saved, notSaved: !saved, dlLabel: saved ? 'Downloaded' : 'Download', toggle: () => this.setState({ saved: { ...s.saved, [i]: !saved } }) };
    });
    const shows = [
      { name: 'The Long Signal', art: '#4A5D73', meta: '2 new' },
      { name: 'Tidewater Weekly', art: '#4F6B5A', meta: '1 new' },
      { name: 'Small Machines', art: '#7A5368', meta: 'Up to date' },
      { name: 'Field Notes FM', art: '#8A6A3F', meta: '1 new' },
      { name: 'The Night Desk', art: '#5B5750', meta: 'Up to date' },
      { name: 'Paper Planes', art: '#6A5E86', meta: '3 new' }
    ];
    return { cards, shows };
  }
}
</script>
</body>
</html>
