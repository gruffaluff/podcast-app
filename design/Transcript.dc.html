<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transcript</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A4512F;text-decoration:none}a:hover{color:#7E3C21}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F3; color: #1F1E1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 52px 12px 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E8E3D8">
<a href="NowPlaying.dc.html" aria-label="Back to player" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F1E1B">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">How radio learned to listen</span>
<span style="font-size: 12px; color: #6B675E">Transcribed on this iPhone</span>
</div>
<button aria-label="Find in transcript" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1F1E1B; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
</button>
</header>

<div style="flex: 1; overflow: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px">
<sc-for list="{{before}}" as="line" hint-placeholder-count="4">
<button onClick="{{line.pick}}" style="border: 0; background: {{line.bg}}; border-radius: 10px; padding: 8px 10px; margin: -8px -10px; text-align: left; display: flex; flex-direction: column; gap: 4px; color: {{line.ink}}">
<span style="font-size: 12px; color: #6B675E; font-variant-numeric: tabular-nums">{{line.who}} · {{line.t}}</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: {{line.size}}; line-height: 1.45">{{line.text}}</span>
</button>
</sc-for>

<div style="display: flex; gap: 8px; flex-wrap: wrap">
<a href="Clip.dc.html" style="min-height: 36px; padding: 0 14px; border-radius: 18px; background: #1F1E1B; color: #FAF8F3; display: flex; align-items: center; font-size: 13px; font-weight: 500">Share clip</a>
<button style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D9D4C7; background: transparent; color: #1F1E1B; font-size: 13px">Copy</button>
<button style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D9D4C7; background: transparent; color: #1F1E1B; font-size: 13px">Bookmark</button>
</div>

<div style="border-top: 1px dashed #D9D4C7; border-bottom: 1px dashed #D9D4C7; padding: 10px 0; display: flex; align-items: center; gap: 8px">
<span style="font-size: 13px; color: #6B675E; flex: 1">Ad break · 1m 40s · will be skipped</span>
<button onClick="{{toggleAd}}" style="min-height: 36px; padding: 0 8px; border: 0; background: transparent; color: #A4512F; font-size: 13px; font-weight: 500">{{adLabel}}</button>
</div>
<sc-if value="{{adOpen}}" hint-placeholder-val="{{ false }}">
<p style="margin: -10px 0 0; font-family: Newsreader, Georgia, serif; font-size: 16px; line-height: 1.45; color: #6B675E">This episode is brought to you by [SPONSOR]… <button style="border: 0; background: transparent; padding: 0; color: #A4512F; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 500">Not an ad?</button></p>
</sc-if>

<sc-for list="{{after}}" as="line" hint-placeholder-count="3">
<button onClick="{{line.pick}}" style="border: 0; background: {{line.bg}}; border-radius: 10px; padding: 8px 10px; margin: -8px -10px; text-align: left; display: flex; flex-direction: column; gap: 4px; color: {{line.ink}}">
<span style="font-size: 12px; color: #6B675E; font-variant-numeric: tabular-nums">{{line.who}} · {{line.t}}</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: {{line.size}}; line-height: 1.45">{{line.text}}</span>
</button>
</sc-for>
</div>

<div style="border-top: 1px solid #E8E3D8; padding: 10px 20px 28px; display: flex; align-items: center; gap: 12px">
<button aria-label="Pause" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1F1E1B; color: #FAF8F3; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
</button>
<span style="flex: 1; font-size: 12px; color: #6B675E; font-variant-numeric: tabular-nums">18:42 / 56:10 · 1.4×</span>
<button style="min-height: 36px; padding: 0 12px; border: 0; border-radius: 18px; background: #F1EEE6; color: #1F1E1B; font-size: 12px; font-weight: 500">Follow along</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'b3', adOpen: false }; }
  renderVals() {
    const s = this.state;
    const style = (l) => ({
      ...l,
      bg: l.id === s.sel ? '#F1EEE6' : 'transparent',
      ink: l.past ? '#6B675E' : '#1F1E1B',
      size: l.id === 'b3' ? '21px' : '18px',
      pick: () => this.setState({ sel: l.id })
    });
    const before = [
      { id: 'b0', who: 'Maya', t: '17:58', past: true, text: 'So the first audience research was literally people with clipboards on street corners.' },
      { id: 'b1', who: 'Dev', t: '18:09', past: true, text: 'Asking what you had listened to yesterday.' },
      { id: 'b2', who: 'Maya', t: '18:14', past: true, text: 'Which nobody remembers accurately. You would name the station you liked, not the one you had on.' },
      { id: 'b3', who: 'Dev', t: '18:31', past: false, text: 'And that gap, between what people say and what they actually do, is the whole story of the next forty years.' }
    ].map(style);
    const after = [
      { id: 'a0', who: 'Maya', t: '20:33', past: false, text: 'Then the portable meters arrived, and suddenly you could hear what people heard.' },
      { id: 'a1', who: 'Dev', t: '20:47', past: false, text: 'Little pagers clipped to your belt, picking up a code hidden in the broadcast.' }
    ].map(style);
    return {
      before, after,
      adOpen: s.adOpen,
      adLabel: s.adOpen ? 'Hide' : 'Show',
      toggleAd: () => this.setState({ adOpen: !s.adOpen })
    };
  }
}
</script>
</body>
</html>
