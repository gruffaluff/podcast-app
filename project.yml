# XcodeGen spec. The Xcode project is generated from this file in CI
# (`xcodegen generate`), so no one needs to open Xcode.
name: Podcasts
options:
  bundleIdPrefix: com.gruffaluff
  deploymentTarget:
    iOS: "27.0"
packages:
  PodcastCore:
    path: Packages/PodcastCore
  # Open-source (Apache 2.0) on-device speaker separation. Its models are
  # downloaded once, free, on first use.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.0
targets:
  Podcasts:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: PodcastCore
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gruffaluff.podcasts
        PRODUCT_NAME: Podcasts
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Extra keys (background audio, http feeds) merged with the generated ones.
        INFOPLIST_FILE: Config/Info.plist
        # iCloud sync. Only used by signed builds; the unsigned test build
        # ignores it and keeps everything on the device.
        CODE_SIGN_ENTITLEMENTS: Config/Podcasts.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Podspot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
schemes:
  Podcasts:
    build:
      targets:
        Podcasts: all
