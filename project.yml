# XcodeGen spec. The Xcode project is generated from this file in CI
# (`xcodegen generate`), so no one needs to open Xcode.
name: Podcasts
options:
  bundleIdPrefix: com.gruffaluff
  deploymentTarget:
    iOS: "26.0"
packages:
  PodcastCore:
    path: Packages/PodcastCore
targets:
  Podcasts:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: PodcastCore
      - target: PoddeckWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gruffaluff.podcasts
        # The bundle name Apple checks must be unique: "Podcasts" is Apple's
        # own app (upload error 90129). The Swift module keeps its old name.
        PRODUCT_NAME: Poddeck
        PRODUCT_MODULE_NAME: Podcasts
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Extra keys (background audio, http feeds) merged with the generated ones.
        INFOPLIST_FILE: Config/Info.plist
        # iCloud sync. Only used by signed builds; the unsigned test build
        # ignores it and keeps everything on the device.
        CODE_SIGN_ENTITLEMENTS: Config/Podcasts.entitlements
        # Set only by the TestFlight workflow (empty otherwise). Kept on this
        # target so package resource bundles aren't given a profile.
        PROVISIONING_PROFILE_SPECIFIER: $(PODDECK_PROFILE)
        INFOPLIST_KEY_CFBundleDisplayName: Poddeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  # Home / Lock Screen widgets and the Control Centre button. They show
  # what the app saves in the shared App Group folder (Shared/).
  PoddeckWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gruffaluff.podcasts.widgets
        PRODUCT_NAME: PoddeckWidgets
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Poddeck
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: Config/Widgets.entitlements
        # Set only by the TestFlight build (empty otherwise).
        PROVISIONING_PROFILE_SPECIFIER: $(PODDECK_WIDGETS_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  Podcasts:
    build:
      targets:
        Podcasts: all
