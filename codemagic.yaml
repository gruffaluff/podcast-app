# Codemagic (codemagic.io) builds Poddeck and uploads it to TestFlight.
# Used because GitHub's free Mac build time ran out (Nov 2026). Free plan:
# 500 Mac minutes a month; with no card on file, builds stop at the limit
# instead of being charged.
#
# Needs an environment variable group "apple" in Codemagic (app settings →
# Environment variables), all marked Secure: ASC_KEY_ID, ASC_ISSUER_ID,
# ASC_KEY_P8 (the .p8 file's whole text) and APPLE_TEAM_ID — the same
# values as the GitHub secrets. See docs/SETUP.md.
workflows:
  testflight:
    name: TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      groups:
        - apple
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    # Skip the app build when a merge only touches the website, design
    # files or notes (Paul, 6 Nov 2026): poddeck.uk (Cloudflare Pages)
    # updates on its own, without spending free Mac minutes. Any change
    # elsewhere still builds. (Tried once on 4 Nov and removed while a
    # missing GitHub webhook was being blamed on it; the filter was fine.)
    when:
      changeset:
        includes:
          - '.'
        excludes:
          - 'website/**'
          - 'docs/**'
          - 'design/**'
          - '**/*.md'
          - 'scripts/build_site.py'
          - 'scripts/new_episode_alerts.py'
          - '.github/**'
    scripts:
      - name: Build, sign and upload to TestFlight
        script: |
          # Codemagic's build counter starts at 1; App Store Connect already
          # has builds up to 12 from GitHub, so stay well clear of those.
          export BUILD_NUMBER=$((100 + ${BUILD_NUMBER:-0}))
          RUN_TESTS=1 scripts/ci_testflight.sh

  # One-off (start it by hand): loads Config/CloudKitSchema.ckdb into the
  # iCloud Development environment with Apple's cktool. Needs the
  # CLOUDKIT_MANAGEMENT_TOKEN variable (CloudKit Console → Settings →
  # Tokens) in the "apple" group. Afterwards: Deploy Schema Changes to
  # Production in the CloudKit Console. A few free Mac minutes.
  cloudkit-schema:
    name: iCloud schema
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      xcode: latest
      groups:
        - apple
    scripts:
      - name: Load the iCloud schema into Development
        script: |
          set -e
          [ -n "${CLOUDKIT_MANAGEMENT_TOKEN:-}" ] || { echo "Add CLOUDKIT_MANAGEMENT_TOKEN to the apple group first."; exit 1; }
          ARGS="--team-id $APPLE_TEAM_ID --container-id iCloud.com.gruffaluff.podcasts --environment development"
          xcrun cktool import-schema $ARGS --file Config/CloudKitSchema.ckdb
          echo "== Development schema now"
          xcrun cktool export-schema $ARGS | grep "RECORD TYPE"
