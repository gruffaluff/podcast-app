name: Build

# Checks pull requests (and runs by hand). Merges into main are built by
# the TestFlight workflow, so they aren't built twice.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Build machine (macos-15-intel is the reliable one; macos-latest is Apple silicon)"
        default: macos-15-intel

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Run PodcastCore tests
        run: |
          set -o pipefail
          swift test --package-path Packages/PodcastCore 2>&1 | tee test.log || {
            echo "::group::Failures"
            grep -E "error:|failed \(" test.log || true
            echo "::endgroup::"
            echo "---- FAILURES ----"
            grep -E "error:|failed \(" test.log || true
            exit 1
          }

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Podcasts.xcodeproj \
            -scheme Podcasts \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
