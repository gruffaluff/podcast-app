name: TestFlight

# Builds a signed copy of the app and uploads it to TestFlight. Runs on every
# merge into main, or by hand ("Run workflow"). Needs the four Apple secrets
# described in notes/SETUP.md; without them it stops with a note and no error.

# Codemagic (codemagic.yaml) now does the automatic uploads on merges to
# main; this workflow is kept for running by hand (and status_only checks).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Build machine (macos-15-intel is the reliable one)"
        default: macos-15-intel
      status_only:
        description: "Only report what App Store Connect has (no build)"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the Apple secrets are set
        id: secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::Apple secrets not set yet (see notes/SETUP.md), so nothing was uploaded."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Use the newest installed Xcode
        if: steps.secrets.outputs.ready == 'true' && !inputs.status_only
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate Xcode project
        if: steps.secrets.outputs.ready == 'true' && !inputs.status_only
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Save the App Store Connect key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      # Signing without a Mac or registered devices: make a key and a
      # certificate request here, have App Store Connect issue a distribution
      # certificate and an App Store profile (scripts/asc_signing.py), and put
      # them in a throwaway keychain.
      - name: Get an App Store certificate and profile
        if: steps.secrets.outputs.ready == 'true' && !inputs.status_only
        env:
          BUNDLE_ID: com.gruffaluff.podcasts
          WIDGETS_BUNDLE_ID: com.gruffaluff.podcasts.widgets
        run: |
          set -e
          S="$RUNNER_TEMP/keys"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          /usr/bin/openssl genrsa -out "$S/signing.key" 2048 2>/dev/null
          /usr/bin/openssl req -new -key "$S/signing.key" -out "$S/signing.csr" -subj "/CN=Poddeck CI/O=Poddeck/C=GB"
          "$RUNNER_TEMP/venv/bin/python" scripts/asc_signing.py prepare "$S/signing.csr" "$S" | tee -a "$GITHUB_ENV"

          /usr/bin/openssl x509 -inform DER -in "$S/distribution.cer" -out "$S/distribution.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$S/signing.key" -in "$S/distribution.pem" -out "$S/signing.p12" -passout pass:ci

          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$S/signing.p12" -k "$KC" -P ci -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

          UUID=$(grep '^PROFILE_UUID=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)
          WUUID=$(grep '^WIDGETS_PROFILE_UUID=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$S/profile.mobileprovision" "$DIR/$UUID.mobileprovision"
            cp "$S/widgets.mobileprovision" "$DIR/$WUUID.mobileprovision"
          done

      - name: Build and sign (archive)
        if: steps.secrets.outputs.ready == 'true' && !inputs.status_only
        run: |
          xcodebuild archive \
            -project Podcasts.xcodeproj \
            -scheme Podcasts \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Podcasts.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PODDECK_PROFILE="$PROFILE_NAME" \
            PODDECK_WIDGETS_PROFILE="$WIDGETS_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            > archive.log 2>&1 || {
              echo "---- last lines ----"; tail -60 archive.log
              echo "---- errors ----"; grep -E "error:|Provisioning|provisioning|entitlement" archive.log | sort -u | head -40
              exit 1
            }
          grep -E "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true' && !inputs.status_only
        run: |
          set -o pipefail
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          cp Config/ExportOptions.plist "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.gruffaluff.podcasts string $PROFILE_NAME" "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.gruffaluff.podcasts.widgets string $WIDGETS_PROFILE_NAME" "$OPTS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Podcasts.xcarchive" \
            -exportOptionsPlist "$OPTS" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} uploaded. Apple takes about 5–30 minutes to process it before it shows in TestFlight."

      - name: What App Store Connect has
        if: always() && steps.secrets.outputs.ready == 'true'
        timeout-minutes: 4
        continue-on-error: true
        env:
          BUNDLE_ID: com.gruffaluff.podcasts
        run: |
          [ -x "$RUNNER_TEMP/venv/bin/python" ] || { python3 -m venv "$RUNNER_TEMP/venv"; "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography; }
          "$RUNNER_TEMP/venv/bin/python" scripts/asc_status.py

      - name: Remove the keys
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
