name: TestFlight

# Builds a signed copy of the app and uploads it to TestFlight. Runs on every
# merge into main, or by hand ("Run workflow"). Needs the four Apple secrets
# described in docs/SETUP.md; without them it stops with a note and no error.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Build machine (macos-15-intel is the reliable one)"
        default: macos-15-intel

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the Apple secrets are set
        id: secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::Apple secrets not set yet (see docs/SETUP.md), so nothing was uploaded."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Use the newest installed Xcode
        if: steps.secrets.outputs.ready == 'true'
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate Xcode project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Save the App Store Connect key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          cp Config/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build and sign (archive)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project Podcasts.xcodeproj \
            -scheme Podcasts \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Podcasts.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            > archive.log 2>&1 || {
              echo "---- last lines ----"; tail -60 archive.log
              echo "---- errors ----"; grep -E "error:|Provisioning|provisioning|entitlement" archive.log | sort -u | head -40
              exit 1
            }
          grep -E "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Podcasts.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} uploaded. Apple takes about 5–30 minutes to process it before it shows in TestFlight."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
